<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">Chiedere assistenza per affrontare una cartella</title>
<desc id="descrizione">Scena originale in uno sportello di orientamento: una donna anziana conversa con una consulente. Nessun tavolo domestico, bolletta o calcolatrice.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7efe5"/><stop offset="1" stop-color="#ddc7b3"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#d8edf0"/><stop offset="1" stop-color="#a2c6ca"/></linearGradient>
 <linearGradient id="floor" x1="0" x2=".3" y2="1"><stop stop-color="#bf9677"/><stop offset="1" stop-color="#825f4d"/></linearGradient>
 <linearGradient id="counter" x1="0" x2="1" y2="1"><stop stop-color="#d6a57a"/><stop offset="1" stop-color="#906546"/></linearGradient>
 <linearGradient id="jacket" x2="1" y2="1"><stop stop-color="#b35e50"/><stop offset="1" stop-color="#80483f"/></linearGradient>
 <linearGradient id="advisor" x2="1" y2="1"><stop stop-color="#3c7879"/><stop offset="1" stop-color="#255559"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#4e3c32" flood-opacity=".2"/></filter>
</defs>
