<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="tit desc">
<title id="tit">Documenti, calendario e calcolatrice per affrontare i debiti</title>
<desc id="desc">Illustrazione originale: su un tavolo di legno, una cartella da verificare, un calendario delle scadenze, una calcolatrice e appunti.</desc>
<defs>
