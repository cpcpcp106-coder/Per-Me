name: Per Me - Importazione fotografia Salute 01
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-foto-salute-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Scarica e verifica foto Pexels con licenza documentata
        shell: bash
        run: |
          set -euo pipefail
          URL="https://images.pexels.com/photos/11370618/pexels-photo-11370618.jpeg?auto=compress&cs=tinysrgb&w=1400"
          OUT="assets/salute-guida-01-visita-medica.jpg"
          curl -fLsS --retry 3 --max-time 80 --connect-timeout 15 -o "$OUT" "$URL"
          MIME="$(file --brief --mime-type "$OUT")"
          BYTES="$(wc -c < "$OUT")"
          echo "MIME: $MIME; bytes: $BYTES"
          test "$MIME" = "image/jpeg"
          test "$BYTES" -ge 20000
          test "$BYTES" -le 1500000
          sha256sum "$OUT"
      - name: Salva la fotografia locale nel progetto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/salute-guida-01-visita-medica.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Per Me: archivia fotografia Pexels verificata per Guida Salute 01"
            git push origin HEAD:main
          else
            echo "Fotografia gia' archiviata"
          fi
