name: Per Me - Tutor AI essenziale
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inventario_sito.py'
      - 'scripts/lib/**'
      - 'FONTI/inventario-contenuti.json'
      - 'gradimento-articoli.json'
      - 'tutor-ai.html'
      - 'scripts/audit-tutor-ai.cjs'
      - 'app/main.js'
      - 'app/index.html'
      - 'app/app.css'
      - 'app/sw.js'
      - 'app/tests/sync-summary.test.cjs'
      - 'index.html'
      - 'sitemap.xml'
      - '.github/workflows/audit-tutor-ai.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inventario_sito.py'
      - 'scripts/lib/**'
      - 'FONTI/inventario-contenuti.json'
      - 'gradimento-articoli.json'
      - 'tutor-ai.html'
      - 'scripts/audit-tutor-ai.cjs'
      - 'app/main.js'
      - 'app/index.html'
      - 'app/app.css'
      - 'app/sw.js'
      - 'app/tests/sync-summary.test.cjs'
      - 'index.html'
      - 'sitemap.xml'
      - '.github/workflows/audit-tutor-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test prompt, copia Android, accessibilita e testi offline
        run: node scripts/audit-tutor-ai.cjs
