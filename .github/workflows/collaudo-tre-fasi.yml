name: Collaudo strumenti Per Me
on:
  push:
    paths:
      - 'scripts/inventario_sito.py'
      - 'scripts/lib/**'
      - 'FONTI/inventario-contenuti.json'
      - 'gradimento-articoli.json'
      - 'app/index.html'
      - 'app/menu-mediterraneo.js'
      - 'app/menu-mediterraneo.html'
      - 'strumenti/**'
      - 'lettura-guide.js'
      - 'spesa-riepilogo.js'
      - 'paniere-mediterraneo.js'
      - 'dieta-guida-08-ricette-mediterranee-economiche-valori.html'
      - 'FONTI/paniere-mediterraneo-*.json'
      - 'scripts/genera-paniere-mediterraneo.py'
      - 'gradimento.js'
      - 'monitoraggio/riscontri*'
      - 'scripts/collaudo-migliorie-20261120.cjs'
      - 'da-dove-cominciare.html'
      - 'index.html'
      - 'style.css'
      - 'site/**'
      - 'scripts/genera-ricette-mediterranee.cjs'
      - 'scripts/collaudo-tre-fasi.cjs'
      - 'scripts/collaudo-lievito-madre.cjs'
      - 'lievito-madre.html'
      - 'pasta-madre-solida-da-zero.html'
      - 'licoli-da-zero.html'
      - 'lievito-madre.css'
      - 'app/catalogo-guide.js'
      - 'app/main.js'
      - 'app/sw.js'
      - '.github/workflows/collaudo-tre-fasi.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collaudo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Esegui test locali su viewport 320 e 390
        run: node scripts/collaudo-tre-fasi.cjs
      - name: Verifica lettura, riscontri, riepilogo PDF e app offline
        run: node scripts/collaudo-migliorie-20261120.cjs
      - name: Verifica i lieviti, le fotografie e la lettura offline
        run: node scripts/collaudo-lievito-madre.cjs
