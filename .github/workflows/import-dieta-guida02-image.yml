name: Per Me - Importa immagine originale dieta Guida 02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-dieta-guida02-image.yml'
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica immagine originale e converti WebP
        env:
          SOURCE_IMAGE: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-3100-81f4-a21a-8a036d8aa3b6/raw?se=2026-10-23T17%3A48%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=031629cd-f996-59f8-adf7-25f786daeee1&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T05%3A43%3A34Z&ske=2026-10-24T05%3A43%3A34Z&sks=b&skv=2026-02-06&sig=KDbzJh0kEYVXrzr7lKeAB1In08MXfoigHYBKAA969pM%3D'
        run: |
          set -euo pipefail
          python -m pip install -q pillow
          curl -fL --retry 2 --max-time 90 "$SOURCE_IMAGE" -o /tmp/dieta-guida02.png
          python - <<'PY'
          from PIL import Image
          import os
          im=Image.open('/tmp/dieta-guida02.png').convert('RGB')
          assert im.width >= 1200 and im.height >= 700, im.size
          im.thumbnail((1200,800),Image.Resampling.LANCZOS)
          im.save('assets/dieta-mediterranea-guida02-originale.webp','WEBP',quality=81,method=6)
          print('SAVED',im.size,os.stat('assets/dieta-mediterranea-guida02-originale.webp').st_size)
          PY
      - name: Archivia immagine nel repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dieta-mediterranea-guida02-originale.webp
          git rm .github/workflows/import-dieta-guida02-image.yml
          git commit -m "Dieta Guida 02: fotografia originale WebP"
          git push
