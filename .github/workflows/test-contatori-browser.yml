name: Per Me - Test browser contatori
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-contatori-browser.cjs'
      - '.github/workflows/test-contatori-browser.yml'
      - 'analytics.js'
      - 'scripts/test-marketing.cjs'
      - 'scripts/test-snapshot-marketing.py'
      - 'scripts/snapshot-marketing.py'
      - 'monitoraggio/marketing*'
      - 'contatori-personali/**'
      - 'contatori-per-me-41c83f9e6c2a4d08b5f71e236ba0d94c.html'
      - 'app/index.html'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'analytics.js'
      - 'scripts/test-marketing.cjs'
      - 'scripts/test-contatori-browser.cjs'
      - 'scripts/test-snapshot-marketing.py'
      - 'scripts/snapshot-marketing.py'
      - 'monitoraggio/marketing*'
      - '.github/workflows/test-contatori-browser.yml'
permissions:
  contents: read
jobs:
  contatori-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Simula lettore e nuova installazione senza incrementi reali
        run: node scripts/test-contatori-browser.cjs
      - name: Verifica metriche marketing senza richieste reali
        run: node scripts/test-marketing.cjs
      - name: Verifica raccolta e dati mancanti con risposte simulate
        run: python3 scripts/test-snapshot-marketing.py
