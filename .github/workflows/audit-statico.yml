name: Per Me - Audit statico integrale
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "app/**"
      - "assets/**"
      - "style.css"
      - "sitemap.xml"
      - "monitoraggio/audit_statico.py"
      - "monitoraggio/pubblica_report.sh"
      - ".github/workflows/audit-statico.yml"
permissions:
  contents: write
concurrency:
  group: per-me-evidenze-main
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica sintassi JavaScript
        run: |
          node --check app/main.js
          node --check app/sw.js
      - name: Inventario, collegamenti, PWA e sitemap
        run: python monitoraggio/audit_statico.py
      - name: Salva lo storico statico senza sovrascrivere gli audit editoriali
        run: |
          bash monitoraggio/pubblica_report.sh "Per Me: snapshot automatico dell'audit statico" monitoraggio/ultimo-audit-statico.json
