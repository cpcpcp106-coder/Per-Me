name: Per Me - Controllo fonti e collegamenti
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'

permissions:
  contents: write

concurrency:
  group: per-me-monitoraggio
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preleva il blog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla fonti e collegamenti
        run: python monitoraggio/controlla.py
      - name: Registra il rapporto nel blog
        run: |
          git config user.name "per-me-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoraggio/stato.json monitoraggio/ultimo-controllo.json
          if ! git diff --cached --quiet; then
            git commit -m "Per Me: rapporto automatico controllo fonti"
            git push
          fi
