name: Per Me - Controllo fonti e collegamenti
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitoraggio.yml'
      - 'monitoraggio/controlla.py'
      - 'monitoraggio/fonti.json'
  schedule:
    - cron: '15 7 * * 1'

permissions:
  contents: write

concurrency:
  group: per-me-monitoraggio
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preleva il blog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla fonti e collegamenti
        run: python monitoraggio/controlla.py
      - name: Registra il rapporto sul main corrente
        run: bash monitoraggio/pubblica_report.sh "Per Me: rapporto automatico controllo fonti" monitoraggio/stato.json monitoraggio/ultimo-controllo.json
