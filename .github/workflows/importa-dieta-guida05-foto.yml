name: Per Me - Importa immagine originale Guida 05
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importa-dieta-guida05-foto.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trasferisci foto originale e converti in WebP
        env:
          SOURCE_IMAGE: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-a490-8243-a5e6-84eec47885ef/raw?se=2026-10-23T20%3A18%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=7ffab1bc-3f46-5638-a535-19dc175f2b92&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T04%3A14%3A38Z&ske=2026-10-24T04%3A14%3A38Z&sks=b&skv=2026-02-06&sig=uX4OvyFrbhN0T9HOQe/AEpn4MKh0sAyVUQJ85bOkAVE%3D'
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          curl -fL --retry 2 --max-time 110 "$SOURCE_IMAGE" -o /tmp/dieta05-originale.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          photo=Image.open('/tmp/dieta05-originale.png').convert('RGB')
          assert photo.width>=1200 and photo.height>=700, photo.size
          photo.thumbnail((1280,900),Image.Resampling.LANCZOS)
          dst=Path('assets/dieta-mediterranea-guida05-olio-grassi-originale.webp')
          photo.save(dst,'WEBP',quality=83,method=6)
          assert dst.stat().st_size>50000
          print('FOTO_ORIGINALE_OK',photo.size,dst.stat().st_size)
          PY
      - name: Archivia foto e rimuovi workflow temporaneo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dieta-mediterranea-guida05-olio-grassi-originale.webp
          git rm .github/workflows/importa-dieta-guida05-foto.yml
          git commit -m "Guida Dieta 05: foto originale iperrealistica olio e grassi"
          git push
