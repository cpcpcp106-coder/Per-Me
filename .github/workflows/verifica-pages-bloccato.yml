name: Per Me - Verifica rilascio Pages bloccato
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verifica-pages-bloccato.yml'

permissions:
  contents: read
  deployments: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla e chiudi solo i deployment sospesi della revisione precedente
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_PRECEDENTE: de03a8c0b4ac88ae618d78af057dcf2e896a53cc
        run: |
          set -euo pipefail
          ids=$(gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" -f sha="$SHA_PRECEDENTE" -f per_page=100 --jq '.[] | select(.environment == "github-pages") | .id')
          if [ -z "$ids" ]; then
            echo "Nessun deployment GitHub ordinario per la versione sospesa: nessuna modifica."
            exit 0
          fi
          for id in $ids; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq 'if length == 0 then "none" else .[0].state end')
            echo "Deployment precedente id=$id stato=$state"
            case "$state" in
              queued|pending|in_progress|error|failure|inactive)
                echo "Rimuovo solo il precedente deployment fallito o incompleto $id; non tocco il sito pubblicato."
                gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive -f description='Archiviazione rilascio precedente fallito'
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/deployments/$id"
                ;;
              *)
                echo "Nessuna cancellazione: il deployment non è in corso."
                ;;
            esac
          done
