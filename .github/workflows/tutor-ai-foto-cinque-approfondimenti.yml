name: Per Me - Importa cinque foto Tutor AI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tutor-ai-foto-cinque-approfondimenti.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importa e ottimizza cinque fotografie originali AI
        env:
          FOTO_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-ff38-8211-a4db-399839d70a4f/raw?se=2026-10-23T16%3A29%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=f6e02150-ac89-5240-91e3-3caab9a44ba8&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T06%3A41%3A51Z&ske=2026-10-24T06%3A41%3A51Z&sks=b&skv=2026-02-06&sig=k40SZDbJ4sy4hdz0Zq/hMK1q3Y4yi1OIewTXp1Cofwg%3D'
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          curl -fL --retry 2 --max-time 90 "$FOTO_URL" -o /tmp/scene-originali.png
          python - <<'PY'
          from PIL import Image
          import os
          source=Image.open('/tmp/scene-originali.png').convert('RGB')
          assert source.size==(1536,1024),source.size
          for label,coords in [["dialogo",[0,0,763,507]],["fonti",[776,0,1536,507]],["confronto",[0,522,509,1024]],["sicurezza",[530,522,1008,1024]],["professionisti",[1018,522,1536,1024]]]:
              dest=f'assets/tutor-ai-{label}-originale.webp'
              image=source.crop(tuple(coords))
              image.save(dest,'WEBP',quality=83,method=6)
              print(dest,image.size,os.path.getsize(dest))
          PY
      - name: Pubblica immagini nel repository e rimuovi workflow temporaneo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tutor-ai-*-originale.webp
          git rm .github/workflows/tutor-ai-foto-cinque-approfondimenti.yml
          git commit -m "Tutor AI: cinque immagini originali per approfondimenti 2-6"
          git push
