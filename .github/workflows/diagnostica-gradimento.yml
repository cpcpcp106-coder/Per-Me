name: Per Me - Diagnostica gradimento
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostica-gradimento.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosi-contatori:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verifica contatori e due eventi sintetici isolati
        shell: bash
        run: |
          set -euo pipefail
          root="https://counterapi.com/api/cpcpcp106-coder.github.io"
          urls=(
            "$root/perme-stelle-5/debiti-guida-09-a-chi-rivolgersi?readOnly=true"
            "$root/perme-stelle-5/debiti-guida-01-leggere-cartella?readOnly=true"
            "$root/perme-stelle-1/debiti-guida-09-a-chi-rivolgersi?readOnly=true"
            "$root/visita/per-me-visite-nuovo-inizio-20261015-v3?readOnly=true"
            "$root/visita/per-me-visite-da-zero-20261015?readOnly=true"
          )
          for i in "${!urls[@]}"; do
            printf 'Sola lettura test %s: ' "$i"
            code="$(curl --location --silent --show-error --max-time 20 --retry 1 --retry-delay 1 -o /tmp/perme-counter-$i -w '%{http_code}' "${urls[$i]}")" || code="transport_error"
            printf 'HTTP %s\n' "$code"
            head -c 450 /tmp/perme-counter-$i 2>/dev/null || true
            printf '\n'
          done
          echo "=== CORS su contatore esistente (solo lettura) ==="
          curl -sS -D /tmp/perme-cors-headers -o /dev/null --max-time 20 \
            -H 'Origin: https://cpcpcp106-coder.github.io' \
            "$root/perme-stelle-5/debiti-guida-09-a-chi-rivolgersi?readOnly=true"
          grep -Ei '^(HTTP/|access-control-|cache-control:|content-type:)' /tmp/perme-cors-headers || true
          echo "=== Contatore diagnostico (nessuna nuova votazione, solo lettura) ==="
          probe_url='https://counterapi.com/api/perme-probe-collaudo/test/perme-probe-stelle-20261015'
          for suffix in 'readOnly=true' 'readOnly=true&revision=perme20261015b' 'readOnly=true&revision=perme20261015c'; do
            echo "Lettura ($suffix):"
            curl -sS --max-time 20 "$probe_url?$suffix" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", "n/d"))'
          done
          echo "=== Contatore primo articolo con parametro anticache (solo lettura) ==="
          curl -sS --max-time 20 "$root/perme-stelle-5/debiti-guida-09-a-chi-rivolgersi?readOnly=true&revision=perme20261015c" |
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", "n/d"))'
          echo "=== Test POST click via GET con contesto browser e behavior vote (isolato) ==="
          browser_headers=(-H 'Origin: https://cpcpcp106-coder.github.io' -H 'Referer: https://cpcpcp106-coder.github.io/Per-Me/' -H 'User-Agent: Mozilla/5.0 Chrome/131.0.0.0 Safari/537.36')
          work="https://counterapi.com/api/perme-diagnostica-stelle20261015"
          echo "Incremento test voto: "
          curl -sS --max-time 20 "${browser_headers[@]}" "$work/voto/test-clic-20261015?behavior=vote" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", "n/d"))'
          echo "Test pixel immagine (isolato): "
          curl -sS --max-time 20 -o /dev/null -w 'HTTP %{http_code}\n' "${browser_headers[@]}" "https://counterapi.com/pixel.gif?ns=perme-diagnostica-stelle20261015&action=pixel&key=test-clic-pixel-20261015"
          sleep 4
          echo "Rilettura sintetica voto (GET): "
          curl -sS --max-time 20 "$work/voto/test-clic-20261015?readOnly=true&revision=probe20261015d" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", "n/d"))'
          echo "Rilettura sintetica pixel (GET): "
          curl -sS --max-time 20 "$work/pixel/test-clic-pixel-20261015?readOnly=true&revision=probe20261015d" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", "n/d"))'
          printf 'Origine pubblica sito: '
          curl -L -sS --max-time 20 -o /dev/null -w 'HTTP %{http_code}\n' "https://cpcpcp106-coder.github.io/Per-Me/gradimento.js"
