name: Per Me - Fotografia originale guida mediterranea 01
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-foto-mediterranea-guida01.yml'
permissions:
  contents: write
jobs:
  save-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Converti fotografia originale in WebP ottimizzato
        env:
          PHOTO_SOURCE: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-48e8-8211-8307-e2bfc32346dc/raw?se=2026-10-23T17%3A01%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=5d8525b4-ada5-5290-8182-e7262127a964&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T05%3A13%3A48Z&ske=2026-10-24T05%3A13%3A48Z&sks=b&skv=2026-02-06&sig=vuL1Mg0DlYn2IgXoWQhKbFI4R84D9DIsTM5HvJQP2Jo%3D'
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          curl -fL --retry 2 --max-time 90 "$PHOTO_SOURCE" -o /tmp/mediterranea-foto.png
          python - <<'PY'
          from PIL import Image
          import os
          im=Image.open('/tmp/mediterranea-foto.png').convert('RGB')
          assert im.width >=1000 and im.height>=650,im.size
          im.thumbnail((1200,800),Image.Resampling.LANCZOS)
          im.save('assets/dieta-mediterranea-guida01-originale.webp','WEBP',quality=80,method=6)
          print("PHOTO_SAVED",im.size,os.path.getsize('assets/dieta-mediterranea-guida01-originale.webp'))
          PY
      - name: Commit fotografia e rimuovi procedura temporanea
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dieta-mediterranea-guida01-originale.webp
          git rm .github/workflows/import-foto-mediterranea-guida01.yml
          git commit -m "Dieta mediterranea: fotografia originale guida 01"
          git push
