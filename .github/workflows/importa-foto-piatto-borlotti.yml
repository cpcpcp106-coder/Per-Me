name: Per Me - Importa foto piatto borlotti e riso
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importa-foto-piatto-borlotti.yml'
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Salva fotografia originale del piatto nel repository
        env:
          PHOTO_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:133/quality:100/uri:ifs%3A%2F%2FM%2F1250ffc8-7c0c-45ca-8b61-5653d8f144d2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAO9rXU7ta8xqwC6uda27hJQ-IpZA-wBh9-iL5jD5ZJdI&exp=1792797043&osig=AAAAAAAAAAAAAAAAAAAAAI2an5un5S4K6FdM_xyfaEjwrLJYj9mfqQAKb10axpp3&signer=media-rpc&token=AAIAAU0AJDEyNTBmZmM4LTdjMGMtNDVjYS04YjYxLTU2NTNkOGYxNDRkMgAAAAABoWsH6ThYRuULLb8lPLjqAEtyFGunfvsAbrQB1RajU466vQrS0g&x-canva-quality=thumbnail'
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 65 "$PHOTO_URL" -o /tmp/piatto.png
          file /tmp/piatto.png
          cp /tmp/piatto.png assets/ricetta-borlotti-riso-piatto-originale.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ricetta-borlotti-riso-piatto-originale.png
          git rm .github/workflows/importa-foto-piatto-borlotti.yml
          git commit -m "Ricetta: fotografia originale del piatto borlotti e riso"
          git push
