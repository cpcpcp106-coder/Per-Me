name: Per Me - Integrita rubriche Debiti
on:
  pull_request:
    branches: [main]
    paths:
      - 'debiti-*.html'
      - 'style.css'
      - 'assets/debiti-guida-*'
      - 'scripts/audit-debiti.cjs'
      - '.github/workflows/audit-debiti.yml'
  push:
    branches: [main]
    paths:
      - 'debiti-*.html'
      - 'style.css'
      - 'assets/debiti-guida-*'
      - 'scripts/audit-debiti.cjs'
      - '.github/workflows/audit-debiti.yml'
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica integrita pagine, immagini e collegamenti interni
        run: node scripts/audit-debiti.cjs
