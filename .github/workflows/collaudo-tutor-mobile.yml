name: Per Me - Tutor AI collaudo smartphone emulato
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tutor-ai*.html'
      - 'assets/tutor-ai-*.webp'
      - 'app/**'
      - 'index.html'
      - 'monitoraggio/collaudo_tutor_mobile.cjs'
      - '.github/workflows/collaudo-tutor-mobile.yml'
permissions:
  contents: read
jobs:
  tutor-mobile:
    # Playwright 1.56.1 supporta Ubuntu 24.04; ubuntu-latest può cambiare versione.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa Playwright
        timeout-minutes: 3
        run: npm install --no-save playwright@1.56.1
      - name: Installa Chromium e dipendenze
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Prova copia prompt, soluzioni, layout mobile e PWA offline
        timeout-minutes: 5
        run: node monitoraggio/collaudo_tutor_mobile.cjs
      - name: Conserva rapporto tecnico del test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-ai-collaudo-mobile
          path: monitoraggio/ultimo-collaudo-tutor-mobile.json
          if-no-files-found: warn
