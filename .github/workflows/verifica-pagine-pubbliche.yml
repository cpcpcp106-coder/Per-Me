name: Per Me - Verifica HTTP pagine pubbliche
on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'style.css'
      - 'monitoraggio/collaudo_browser.cjs'
      - '.github/workflows/verifica-pagine-pubbliche.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'style.css'
      - 'monitoraggio/collaudo_browser.cjs'
      - '.github/workflows/verifica-pagine-pubbliche.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica-pages-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verifica home e Guide 01-06 nazionali e regionali sul sito pubblico
        shell: bash
        run: |
          set -euo pipefail
          base="https://cpcpcp106-coder.github.io/Per-Me/"
          paths=(
            ""
            "agevolazioni-diritti.html"
            "agevolazioni-guida-01-isee-corrente.html"
            "agevolazioni-guida-02-bonus-sociali.html"
            "agevolazioni-guida-03-trasporti-fvg.html"
            "agevolazioni-guida-04-esenzioni-ticket-fvg.html"
            "agevolazioni-guida-03-trasporti-italia.html"
            "agevolazioni-guida-04-esenzioni-ticket-italia.html"
            "agevolazioni-guida-06-affitto-sfratto-aiuti-italia.html"
            "app/"
            "contatori-personali/"
          )
          # Su una PR la nuova guida non esiste ancora sul sito pubblico.
          # Verificala esclusivamente dopo il merge (push main), quando Pages la distribuisce.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            paths+=("agevolazioni-guida-05-comune-servizi-sociali-italia.html")
          fi
          failed=0
          for path in "${paths[@]}"; do
            url="${base}${path}"
            ok=0
            for attempt in 1 2 3; do
              status=$(curl -L -sS --max-time 25 -o /tmp/per-me-http-test.html -w '%{http_code}' "${url}?test=20261015" || true)
              echo "HTTP ${status} | ${url} | tentativo ${attempt}"
              if [[ "$status" == "200" ]] && grep -qi '<h1' /tmp/per-me-http-test.html; then
                ok=1
                break
              fi
              sleep 8
            done
            if [[ "$ok" != "1" ]]; then
              echo "::error::Pagina non pubblicata (HTTP != 200 o H1 mancante): ${url}"
              failed=1
            fi
          done
          # Verifica che il nuovo codice di conteggio sia stato distribuito.
          asset_status=$(curl -L -sS --max-time 25 -o /tmp/per-me-analytics.js -w '%{http_code}' "${base}analytics.js?verifica=${GITHUB_RUN_ID}" || true)
          if [[ "$asset_status" != "200" ]] || ! grep -q 'countapi.mileshilliard.com/api/v1/hit/' /tmp/per-me-analytics.js; then
            echo "::error::Lo script del nuovo contatore non risulta pubblicato correttamente"
            failed=1
          fi
          # Diagnostica non bloccante: sola lettura delle nuove chiavi,
          # HTTP 404 valido se non è stato ancora registrato alcun evento.
          for item in "visita:perme-visite-dal-20261018-43bcc26da793" "installazione:perme-installazioni-dal-20261018-43bcc26da793"; do
            action="${item%%:*}"
            key="${item#*:}"
            http=$(curl -sSL --max-time 12 -H 'Origin: https://cpcpcp106-coder.github.io' \
              -D "/tmp/per-me-${action}.headers" -o "/tmp/per-me-${action}.json" -w '%{http_code}' \
              "https://countapi.mileshilliard.com/api/v1/get/${key}?test=${GITHUB_RUN_ID}" || true)
            echo "Contatore ${action}: HTTP ${http} (200=valore, 404=nuova chiave vuota)"
            head -c 200 "/tmp/per-me-${action}.json" 2>/dev/null || true
            echo
            grep -i '^access-control-allow-origin:' "/tmp/per-me-${action}.headers" || true
          done
          exit "$failed"
