name: Per Me - Importazione foto originale Tutor AI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-tutor-ai-photo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova-foto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prova download sorgente generata
        env:
          CANVA_THUMB: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F914cb6a9-9b81-4be2-ad00-4a852f2c4086/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAANYT-VJt1fuVwATOT7SmzokG92t6v8nc0oGofpymqQ2H&exp=1792785233&osig=AAAAAAAAAAAAAAAAAAAAAACjIsSsF76UKUbcW9RGYPjtaP603bSfuJjC2Y2tdCD5&signer=media-rpc&token=AAIAAU0AJDkxNGNiNmE5LTliODEtNGJlMi1hZDAwLTRhODUyZjJjNDA4NgAAAAABoWpTtGhRbVT6IW8H_a2CVTm_WDtiYoigfR1pBfYTMr4hIiloDw&x-canva-quality=thumbnail'
        run: |
          set -u
          large="${CANVA_THUMB/height:200/height:1200}"
          large="${large/width:133/width:800}"
          echo "Testing thumbnail address:"
          curl -L -sS -w 'thumb HTTP: %{http_code} bytes: %{size_download}\n' -o /tmp/thumb.png "$CANVA_THUMB" || true
          file /tmp/thumb.png || true
          echo "Testing high-resolution image:"
          curl -L -sS -w 'large HTTP: %{http_code} bytes: %{size_download}\n' -o /tmp/high.png "$large" || true
          file /tmp/high.png || true
          echo "Testing direct media source:"
          direct='https://media.canva.com/ifs%3A%2F%2FM%2F914cb6a9-9b81-4be2-ad00-4a852f2c4086'
          curl -L -sS -w 'direct HTTP: %{http_code} bytes: %{size_download}\n' -o /tmp/direct.png "$direct" || true
          file /tmp/direct.png || true
