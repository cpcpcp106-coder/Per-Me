name: Per Me - Indicizzazione di tutte le pagine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indicizzazione:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML, canonical, sitemap, raggiungibilità dalla home, script e robots
        run: python scripts/audit-indicizzazione.py
