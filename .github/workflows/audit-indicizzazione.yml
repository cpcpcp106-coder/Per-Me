name: Per Me - Verifica tecnica di indicizzabilità
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indicizzazione:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Verifica l'indicizzabilità tecnica, non l'effettiva presenza nell'indice Google.
      - name: HTML, canonical, sitemap, collegamenti e direttive robots
        run: python scripts/audit-indicizzazione.py
