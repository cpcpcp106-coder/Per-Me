name: Per Me - Guida 08 Assegno unico e famiglie
on:
  push:
    branches: [main]
    paths:
      - 'agevolazioni-guida-08-assegno-unico-aiuti-famiglie-2026.html'
      - 'agevolazioni-diritti.html'
      - 'index.html'
      - 'sitemap.xml'
      - 'FONTI/registro-diritti-immagini.json'
      - 'scripts/audit-agevolazioni-08.cjs'
      - '.github/workflows/audit-agevolazioni-08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agevolazioni-guida-08-assegno-unico-aiuti-famiglie-2026.html'
      - 'agevolazioni-diritti.html'
      - 'index.html'
      - 'sitemap.xml'
      - 'FONTI/registro-diritti-immagini.json'
      - 'scripts/audit-agevolazioni-08.cjs'
      - '.github/workflows/audit-agevolazioni-08.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica Guida 08, fonti, immagini e collegamenti
        run: node scripts/audit-agevolazioni-08.cjs
