name: Per Me - Guida 06 Affitto e sfratto
on:
  push:
    branches: [main]
    paths:
      - 'agevolazioni-guida-06-affitto-sfratto-aiuti-italia.html'
      - 'agevolazioni-diritti.html'
      - 'index.html'
      - 'sitemap.xml'
      - 'scripts/audit-agevolazioni-06.cjs'
      - '.github/workflows/audit-agevolazioni-06.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agevolazioni-guida-06-affitto-sfratto-aiuti-italia.html'
      - 'agevolazioni-diritti.html'
      - 'index.html'
      - 'sitemap.xml'
      - 'scripts/audit-agevolazioni-06.cjs'
      - '.github/workflows/audit-agevolazioni-06.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica Guida 06 nazionale e riferimenti
        run: node scripts/audit-agevolazioni-06.cjs
