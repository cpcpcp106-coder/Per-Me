name: Per Me - Collaudo browser e fonti esterne
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "app/**"
      - "style.css"
      - "sitemap.xml"
      - "monitoraggio/collaudo_browser.cjs"
      - "monitoraggio/verifica_url_esterni.py"
      - "monitoraggio/pubblica_report.sh"
      - ".github/workflows/collaudo-browser.yml"
permissions:
  contents: write
concurrency:
  group: per-me-evidenze-main
  cancel-in-progress: false
jobs:
  collaudo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa Playwright, Chromium e axe-core
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Test browser responsive, WCAG automatizzati, sincronizzazione e offline
        run: node monitoraggio/collaudo_browser.cjs
      - name: Controlla tutte le destinazioni HTTP esterne
        run: python monitoraggio/verifica_url_esterni.py
      - name: Archivia risultati con controlli non superati espliciti
        if: always()
        run: |
          bash monitoraggio/pubblica_report.sh "Per Me: evidenze browser e collegamenti esterni" monitoraggio/ultimo-collaudo-browser.json monitoraggio/ultimo-controllo-url-esterni.json
