name: Per Me - Collaudo browser e fonti esterne
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.html"
      - "app/**"
      - "style.css"
      - "site/**"
      - "scripts/genera-ricette-mediterranee.cjs"
      - "lettura-guide.js"
      - "gradimento.js"
      - "monitoraggio/collaudo_browser.cjs"
      - ".github/workflows/collaudo-browser.yml"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "app/**"
      - "style.css"
      - "site/**"
      - "scripts/genera-ricette-mediterranee.cjs"
      - "lettura-guide.js"
      - "gradimento.js"
      - "sitemap.xml"
      - "monitoraggio/collaudo_browser.cjs"
      - "monitoraggio/verifica_url_esterni.py"
      - "monitoraggio/pubblica_report.sh"
      - ".github/workflows/collaudo-browser.yml"
permissions:
  contents: write
concurrency:
  group: per-me-evidenze-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  collaudo:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa Playwright, Chromium e axe-core
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Test browser responsive, WCAG automatizzati, sincronizzazione e offline
        run: node monitoraggio/collaudo_browser.cjs
      - name: Controlla tutte le destinazioni HTTP esterne
        if: github.ref == 'refs/heads/main'
        run: python monitoraggio/verifica_url_esterni.py
      - name: Conserva le evidenze del collaudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaudo-browser-${{ github.run_id }}
          path: monitoraggio/ultimo-collaudo-browser.json
      - name: Archivia risultati con controlli non superati espliciti
        if: always() && github.ref == 'refs/heads/main'
        run: |
          bash monitoraggio/pubblica_report.sh "Per Me: evidenze browser e collegamenti esterni" monitoraggio/ultimo-collaudo-browser.json monitoraggio/ultimo-controllo-url-esterni.json
